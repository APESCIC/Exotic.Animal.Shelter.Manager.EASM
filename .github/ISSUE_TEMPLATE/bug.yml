name: Bug
description: Something in EASM doesn't work as it should
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please don't include real animal, person or medical records, passwords or tokens.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page address, and the version from /health if you can see it.
      placeholder: https://easm.example.org/animals, version 0.6.2
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Paste or drag images here.
