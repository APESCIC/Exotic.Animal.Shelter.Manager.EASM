name: Deploy to Cloudron

# Deploys the APES-owned EASM instance only. Shelters self-host from a clone or zip.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (blank = latest release)
        required: false
        default: ''
      first_deploy:
        description: Allow switching the Cloudron app from its current package (e.g. LAMP) to EASM
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-cloudron
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/apescic/easm

jobs:
  deploy:
    name: Build image and update Cloudron app
    runs-on: ubuntu-latest
    env:
      CLOUDRON_SERVER: ${{ secrets.CLOUDRON_SERVER }}
      CLOUDRON_TOKEN: ${{ secrets.CLOUDRON_TOKEN }}
      CLOUDRON_APP_ID: ${{ vars.CLOUDRON_APP_ID }}
      EASM_MANIFEST_ID: uk.org.apes.easm

    steps:
      - name: Check Cloudron settings
        run: |
          missing=""
          [ -n "$CLOUDRON_SERVER" ] || missing="$missing secret CLOUDRON_SERVER"
          [ -n "$CLOUDRON_TOKEN" ] || missing="$missing secret CLOUDRON_TOKEN"
          [ -n "$CLOUDRON_APP_ID" ] || missing="$missing variable CLOUDRON_APP_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          version="${tag#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not a semver release tag (vX.Y.Z)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: EASM_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloudron CLI
        run: npm install --global cloudron

      - name: Set manifest version
        run: |
          jq --arg v "${{ steps.tag.outputs.version }}" '.version = $v' CloudronManifest.json > manifest.tmp
          mv manifest.tmp CloudronManifest.json

      - name: Update Cloudron app
        env:
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          current="$(cloudron status --server "$CLOUDRON_SERVER" --token "$CLOUDRON_TOKEN" --app "$CLOUDRON_APP_ID" | awk -F':[ \t]*' '/^Manifest Id/ {print $2}')"
          force=""
          if [ "$current" != "$EASM_MANIFEST_ID" ]; then
            if [ "$FIRST_DEPLOY" != "true" ]; then
              echo "::error::Cloudron app $CLOUDRON_APP_ID runs '$current', not EASM. Re-run this workflow manually with first_deploy=true to switch it (Cloudron backs up first)."
              exit 1
            fi
            force="--force"
          fi
          cloudron update --server "$CLOUDRON_SERVER" --token "$CLOUDRON_TOKEN" \
            --app "$CLOUDRON_APP_ID" --image "$IMAGE:${{ steps.tag.outputs.version }}" $force

      - name: Check deployed health
        run: |
          location="$(cloudron status --server "$CLOUDRON_SERVER" --token "$CLOUDRON_TOKEN" --app "$CLOUDRON_APP_ID" | awk -F':[ \t]*' '/^Location/ {print $2}')"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://$location/health" | tee /dev/stderr | grep -q '"version":"${{ steps.tag.outputs.version }}"'; then
              echo "Deployed ${{ steps.tag.outputs.version }} to https://$location"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$location/health did not report version ${{ steps.tag.outputs.version }}."
          exit 1
