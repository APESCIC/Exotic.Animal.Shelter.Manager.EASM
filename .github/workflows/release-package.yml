# Attaches the shared-hosting zip, SHA256SUMS and minisign signature when a GitHub Release is published.
# Does not run on ordinary pushes or pull requests. The Release itself is created by release.yml on the tag.
name: Release package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and attach release package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check the tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Release tag $tag does not match VERSION ($version)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_mysql, bcmath, intl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Find the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install production dependencies
        run: composer install --no-dev --no-scripts --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Install minisign and zip
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign zip

      - name: Require the minisign secret
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MINISIGN_SECRET_KEY:-}" ]]; then
            echo "::error::MINISIGN_SECRET_KEY is missing. apescic-director holds the private key as a repository Actions secret."
            exit 1
          fi

      - name: Build the zip
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-release-package.sh
          scripts/build-release-package.sh "$VERSION" "$PWD/dist"
          package="$PWD/dist/easm-${VERSION}.zip"
          test -f "$package"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "package_name=$(basename "$package")" >> "$GITHUB_OUTPUT"

      - name: Checksum, sign and verify
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.build.outputs.package }}"
          name="${{ steps.build.outputs.package_name }}"
          dist="$(dirname "$package")"
          key_file="$RUNNER_TEMP/easm-release.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
          chmod 600 "$key_file"

          (
            cd "$dist"
            sha256sum "$name" > SHA256SUMS
            minisign -S -s "$key_file" -m "$name" -t "EASM $TAG"
            minisign -Vm "$name" -p "$GITHUB_WORKSPACE/resources/keys/easm-release.minisign.pub"
            sha256sum -c SHA256SUMS
          )

          rm -f "$key_file"
          echo "Signed and verified $name"

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.build.outputs.package_name }}"
          dist="$(dirname "${{ steps.build.outputs.package }}")"
          gh release upload "$TAG" \
            "$dist/$name" \
            "$dist/SHA256SUMS" \
            "$dist/${name}.minisig" \
            --clobber
          {
            echo "## Release package"
            echo "- Attached \`$name\`, \`SHA256SUMS\` and \`${name}.minisig\`"
            echo "- Verified with \`resources/keys/easm-release.minisign.pub\` (key id 0263FE993EE2A87C)"
          } >> "$GITHUB_STEP_SUMMARY"
