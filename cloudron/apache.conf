Listen 8000

ServerName localhost

# Cloudron's nginx terminates TLS and forwards from the internal Docker network.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

<VirtualHost *:8000>
    DocumentRoot /app/code/public

    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /app/code/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
