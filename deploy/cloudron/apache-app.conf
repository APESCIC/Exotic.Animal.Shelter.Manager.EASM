# Apache site for EASM on the APES Cloudron LAMP app.
# activate-release.sh installs it as /app/data/apache/app.conf; the restart after a deploy loads it.

ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off
    DocumentRoot /app/data/easm/public

    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
    CustomLog "|/bin/cat" proxy
    ErrorLog "|/bin/cat"

    <Directory /app/data/easm/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Cloudron's real client IP, host and HTTPS (RPAF_SetHTTPS) for Laravel's URLs. Keep it.
    Include "/app/code/apache/rpaf.conf"
    # phpMyAdmin at /phpmyadmin, as in the LAMP default; remove this line to turn it off.
    Include "/app/code/apache/phpmyadmin.conf"
</VirtualHost>
