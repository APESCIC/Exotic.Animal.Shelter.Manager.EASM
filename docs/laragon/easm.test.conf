# EASM's own Laragon virtual host: PHP 8.3 (as in the Cloudron image) through
# FastCGI, while Laragon's other sites keep its global PHP. Copy it to
# C:\laragon\etc\apache2\sites-enabled\easm.test.conf (no "auto." prefix, so
# Laragon keeps it) and delete auto.easm.test.conf, then Reload Apache.
# scripts\laragon-setup.ps1 -InstallVhost does exactly that.
define ROOT "C:/laragon/www/easm/public"
define SITE "easm.test"
define EASM_PHP "C:/laragon/bin/php/php-8.3.33-Win32-vs16-x64"

FcgidCmdOptions "${EASM_PHP}/php-cgi.exe" \
    InitialEnv PHPRC="${EASM_PHP}" \
    InitialEnv PATH="${EASM_PHP};C:/Windows/system32;C:/Windows;C:/Windows/System32/Wbem;" \
    InitialEnv PHP_FCGI_MAX_REQUESTS=0

<VirtualHost *:80>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.php$">
        AddHandler fcgid-script .php
        Options +ExecCGI
        FcgidWrapper "${EASM_PHP}/php-cgi.exe" .php
    </FilesMatch>
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.php$">
        AddHandler fcgid-script .php
        Options +ExecCGI
        FcgidWrapper "${EASM_PHP}/php-cgi.exe" .php
    </FilesMatch>

    SSLEngine on
    SSLCertificateFile      C:/laragon/etc/ssl/laragon.crt
    SSLCertificateKeyFile   C:/laragon/etc/ssl/laragon.key
</VirtualHost>